<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day view — Provider Readiness</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="dayview"></div>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="dayview.js"></script>
  <script>
    Dayview.mount(document.getElementById('dayview'), {
      config: window.DAYVIEW_CONFIG,
      providers: window.DAYVIEW_DATA.providers,
      loadDay: window.DAYVIEW_DATA.loadDay,
      // Connect your CRM here. Return a Promise; if it rejects, the change is rolled back.
      onSave: async (change) => console.log('save', change.type, change.appointment)
    });
  </script>
</body>
</html>
